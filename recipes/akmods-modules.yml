modules:
  - type: copy
    from: ghcr.io/ublue-os/akmods-extra:KERNEL_VERSION
    src: /rpms/
    dest: /tmp/rpms

  - type: script
    snippets:
      - "sed -i 's@enabled=0@enabled=1@g' /etc/yum.repos.d/_copr_ublue-os-akmods.repo"

  - type: containerfile
    snippets:
      - RUN find /tmp/rpms
      - RUN rpm-ostree install /tmp/rpms/kmods/*nct6687*.rpm
