modules:
  - type: copy
    from: ghcr.io/ublue-os/akmods-extra:KERNEL_VERSION_PLACEHOLDER
    src: /rpms/
    dest: /tmp/rpms

  - type: containerfile
    snippets:
      - RUN sed -i 's@enabled=0@enabled=1@g' /etc/yum.repos.d/_copr_ublue-os-akmods.repo
      - RUN find /tmp/rpms
      - RUN dnf -y install /tmp/rpms/kmods/*nct6687*.rpm
