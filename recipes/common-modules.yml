modules:
  - type: signing

  - type: files
    files:
      - source: system/common
        destination: /

  - type: fonts
    fonts:
      nerd-fonts:
        - FiraCode

  # Docker
  - type: dnf
    repos:
      cleanup: true
      files:
        - https://download.docker.com/linux/fedora/docker-ce.repo
    install:
      packages:
        - docker-ce
        - docker-ce-cli
        - docker-compose-plugin
        - docker-buildx-plugin
        - containerd.io

  # VS Code
  - type: dnf
    repos:
      cleanup: true
      files:
        - vscode.repo
      keys:
        - https://packages.microsoft.com/keys/microsoft.asc
    install:
      packages:
        - code

  # Virtualization
  - type: dnf
    install:
      packages:
        - virt-manager

  # Cooler Control
  - type: dnf
    repos:
      cleanup: true
      copr:
        - codifryed/CoolerControl
    install:
      packages:
        - coolercontrol
        - liquidctl

  # Enable Terra for package that requires it
  - type: containerfile
    snippets:
      - RUN sed -i 's@enabled=0@enabled=1@g' /etc/yum.repos.d/terra.repo
      - RUN sed -i 's@enabled=0@enabled=1@g' /etc/yum.repos.d/terra-extras.repo

  # Klassy
  - type: dnf
    install:
      packages:
        - klassy
        - akmod-nct6687d

  # Akmods
  - from-file: local-akmods-modules.yml

  # Terra Cleanup
  - type: containerfile
    snippets:
      - RUN sed -i 's@enabled=1@enabled=0@g' /etc/yum.repos.d/terra.repo
      - RUN sed -i 's@enabled=1@enabled=0@g' /etc/yum.repos.d/terra-extras.repo
  # Misc
  - type: dnf
    repos:
      cleanup: true
      copr:
        - jackgreiner/wallpaper-engine-kde-plugin
    install:
      packages:
        - ptyxis
        - zsh
        - wallpaper-engine-kde-plugin

  - type: systemd
    system:
      enabled:
        # Virtualization
        - libvirtd.service
        # Docker
        - docker.service
        - containerd.service
        - coolercontrold.service
