modules:
  - type: signing

  - type: files
    files:
      - source: system/common
        destination: /

  - type: fonts
    fonts:
      nerd-fonts:
        - FiraCode

  # Virtualization
  - type: rpm-ostree
    install:
      - virt-manager
      - edk2-ovmf
      - libvirt
      - qemu

  # Docker
  - type: rpm-ostree
    install:
      - docker-ce
      - docker-ce-cli
      - docker-compose-plugin
      - docker-buildx-plugin
      - containerd.io

  # Misc
  - type: rpm-ostree
    install:
      - zsh
      - coolercontrol
      - liquidctl
      - code

  - type: systemd
    system:
      enabled:
        # Virtualization
        - libvirtd.service
        # Docker
        - docker.service
        - containerd.service
        - coolercontrold.service

