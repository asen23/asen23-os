modules:
  - type: signing

  - type: files
    files:
      - source: system/common
        destination: /

  - type: fonts
    fonts:
      nerd-fonts:
        - FiraCode

  # Docker
  - type: dnf
    repos:
      cleanup: true
      files:
        - https://download.docker.com/linux/fedora/docker-ce.repo
    install:
      packages:
        - docker-ce
        - docker-ce-cli
        - docker-compose-plugin
        - docker-buildx-plugin
        - containerd.io

  # VS Code
  - type: dnf
    repos:
      cleanup: true
      files:
        - vscode.repo
      keys:
        - https://packages.microsoft.com/keys/microsoft.asc
    install:
      packages:
        - code

  # Virtualization
  - type: dnf
    install:
      packages:
        - virt-manager

  # Cooler Control
  - type: dnf
    repos:
      cleanup: true
      copr:
        - codifryed/CoolerControl
    install:
      packages:
        - coolercontrol
        - liquidctl

  # Cloudflare Warp
  # - type: dnf
  #   repos:
  #     cleanup: true
  #     files:
  #       - https://pkg.cloudflareclient.com/cloudflare-warp-ascii.repo
  #     keys:
  #       - https://pkg.cloudflareclient.com/pubkey.gpg
  #   install:
  #     packages:
  #       - cloudflare-warp

  # Enable Terra for package that requires it
  # Bazzite ships Terra disabled from /etc/dnf/repos.override.d, which takes
  # precedence over the repo files. That override wins over both the F44
  # /etc/yum.repos.d/*.repo and the F45 /usr/share/dnf5/repos.d/*.repo
  # locations, so toggle it with dnf5's config-manager instead of sed.
  - type: containerfile
    snippets:
      - RUN dnf5 config-manager setopt --create-missing-dir terra.enabled=1 terra-extras.enabled=1

  # Klassy
  - type: dnf
    install:
      packages:
        - klassy

  # Akmods
  # - from-file: local-akmods-modules.yml

  # Terra Cleanup
  - type: containerfile
    snippets:
      - RUN dnf5 config-manager setopt --create-missing-dir terra.enabled=0 terra-extras.enabled=0
  # Misc
  - type: dnf
    install:
      packages:
        - ptyxis
        - zsh

  - type: systemd
    system:
      enabled:
        # Virtualization
        - libvirtd.service
        # Docker
        - docker.service
        - containerd.service
        - coolercontrold.service
