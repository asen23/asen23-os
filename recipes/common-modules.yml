modules:
  - type: signing

  - type: files
    files:
      - source: system/common
        destination: /

  - type: fonts
    fonts:
      nerd-fonts:
        - FiraCode

  # Docker
  - type: dnf
    repos:
      cleanup: true
      files:
        - https://download.docker.com/linux/fedora/docker-ce.repo
    install:
      packages:
        - docker-ce
        - docker-ce-cli
        - docker-compose-plugin
        - docker-buildx-plugin
        - containerd.io

  # VS Code
  - type: dnf
    repos:
      cleanup: true
      files:
        - vscode.repo
      keys:
        - https://packages.microsoft.com/keys/microsoft.asc
    install:
      packages:
        - code

  # Virtualization
  - type: dnf
    install:
      packages:
        - virt-manager

  # Cooler Control
  - type: dnf
    repos:
      cleanup: true
      copr:
        - codifryed/CoolerControl
    install:
      packages:
        - coolercontrol
        - liquidctl

  # Misc
  - type: dnf
    install:
      packages:
        - zsh
        - merkuro

  - type: systemd
    system:
      enabled:
        # Virtualization
        - libvirtd.service
        # Docker
        - docker.service
        - containerd.service
        - coolercontrold.service

